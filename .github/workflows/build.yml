name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          # La valeur par defaut demande aussi le paquet historique « tools »,
          # que Google ne fournit plus : l'etape echouait avant meme de
          # compiler (« Failed to find package 'tools' », constate le 08/10).
          packages: 'platform-tools'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # TOUJOURS LA MEME CLE DE SIGNATURE.
      # Sans elle, Android refuse d'installer une mise a jour par-dessus
      # l'ancienne : il faudrait desinstaller Sonora, et perdre playlists,
      # titres aimes et points (ils vivent dans l'application).
      # v2.5 : c'est la MEME cle qu'avant (meme certificat), mais rangee sous
      # un vrai mot de passe, et l'APK est compilee en « release » (plus de
      # mode debogage). Deux secrets, tous deux obligatoires :
      #   SONORA_KEYSTORE      le fichier de cle, en base64
      #   SONORA_KEYSTORE_MDP  son mot de passe
      # S'il en manque un, on s'arrete ici, en clair : une APK signee d'une
      # autre cle ne s'installerait pas par-dessus.
      - name: Poser la cle de signature Sonora
        env:
          CLE: ${{ secrets.SONORA_KEYSTORE }}
          MDP: ${{ secrets.SONORA_KEYSTORE_MDP }}
        run: |
          if [ -z "$CLE" ] || [ -z "$MDP" ]; then
            echo "::error::Secrets SONORA_KEYSTORE et SONORA_KEYSTORE_MDP obligatoires (voir 4-APK-v2.5/A-FAIRE-APK.md)."
            exit 1
          fi
          printf '%s' "$CLE" | base64 -d > "$RUNNER_TEMP/sonora-release.p12"
          echo "SONORA_KEYSTORE_FICHIER=$RUNNER_TEMP/sonora-release.p12" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        env:
          SONORA_KEYSTORE_MDP: ${{ secrets.SONORA_KEYSTORE_MDP }}
          SONORA_KEY_ALIAS: sonora
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'APK
        run: mv app/build/outputs/apk/release/app-release.apk sonora.apk

      - name: Effacer la cle du disque
        if: always()
        run: rm -f "$RUNNER_TEMP/sonora-release.p12"

      # Seule la branche main publie une version. Une autre branche sert a
      # verifier que tout compile : son APK reste dans l'onglet Actions.
      - name: Publier la release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" sonora.apk \
            --target "${{ github.sha }}" \
            --title "Sonora build ${{ github.run_number }}" \
            --notes "APK installable directement depuis le telephone."

      - name: Garder l'APK d'essai
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sonora-apk
          path: sonora.apk
