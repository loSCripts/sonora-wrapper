<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1318" media="(prefers-color-scheme: dark)">
<meta name="description" content="Carte des données publiques récentes : séismes, pression et température de l'air, qualité de l'air, débit mobile et bruit.">
<title>Sensor Maps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --papier:#f4f5f7; --surface:#ffffff; --voile:#eceef2; --trait:#dcdfe5;
  --encre:#0f1720; --encre2:#586270; --focus:#0b57d0; --alerte:#b3261e;
  --signal:#c2185b; --signal-ink:#ffffff;
  --map-bg:#e4e7ec; --ombre:0 2px 10px rgba(15,23,32,.22); --piste:#b4bbc6;
}
@media (prefers-color-scheme:dark){
  :root{
    --papier:#0f1318; --surface:#171c22; --voile:#1f252d; --trait:#2b323b;
    --encre:#eef1f5; --encre2:#9aa5b3; --focus:#8ab4ff; --alerte:#ffb4ab;
    --signal:#ff7aa5; --signal-ink:#2b0615;
    --map-bg:#1a2027; --ombre:0 2px 12px rgba(0,0,0,.6); --piste:#4a5461;
  }
  .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.75)}
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;overflow:hidden}
body{margin:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh;overflow:hidden;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--papier);color:var(--encre)}
h1,h2,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.evite{position:absolute;left:8px;top:-60px;z-index:2000;background:var(--encre);color:var(--papier);padding:10px 14px;border-radius:8px;text-decoration:none}
.evite:focus{top:8px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* En-tête et pied */
.haut{background:var(--papier)}
.marque{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px}
.marque svg{width:24px;height:24px;flex:none}
.marque h1{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.pied{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px 0 4px;padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--trait)}
.lien-i{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 12px 0 10px;color:inherit;text-decoration:none;font-weight:600}
.lien-i .ico{width:22px;height:22px}
.attrib{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font-size:12px;color:var(--encre2)}

/* Carte */
.carte-zone{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.plan{position:relative;flex:1 1 auto;min-height:0}
#carte{position:absolute;inset:0;background:var(--map-bg);z-index:0;isolation:isolate;font:inherit}
.cv{position:absolute;left:0;top:0;pointer-events:none}
.leaflet-container .leaflet-bar a{width:44px;height:44px;line-height:44px;font-size:22px}
.leaflet-container .leaflet-bar a:first-child{border-top-left-radius:10px;border-top-right-radius:10px}
.leaflet-container .leaflet-bar a:last-child{border-bottom-left-radius:10px;border-bottom-right-radius:10px}
.leaflet-container .leaflet-bar a.loc{display:flex;align-items:center;justify-content:center}
.leaflet-top.leaflet-right{margin-top:8px}
.plan.couleurs .leaflet-top.leaflet-right{margin-top:60px}
.carte-vide{display:flex;align-items:center;justify-content:center;height:100%;padding:20px;text-align:center;color:var(--encre2)}
.pin-wrap{background:none;border:0}
.pin{display:block;width:44px;height:44px;overflow:visible;filter:drop-shadow(0 2px 3px rgba(15,23,32,.45));transform-origin:50% 93%;transition:transform .12s}
.pin-wrap.leve .pin{transform:translateY(-8px) scale(1.1)}

/* Commandes flottantes */
.barre{position:absolute;left:0;right:0;top:0;z-index:500;display:flex;align-items:flex-start;padding:8px;pointer-events:none}
.bascule{pointer-events:auto;flex:none;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px 0 10px;border:0;border-radius:22px;background:var(--surface);box-shadow:var(--ombre);font-weight:600;cursor:pointer}
.piste{position:relative;width:38px;height:22px;border-radius:11px;background:var(--piste);transition:background .15s}
.piste::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.bascule[aria-checked="true"] .piste{background:var(--encre)}
.bascule[aria-checked="true"] .piste::after{transform:translateX(16px)}
.puces{--g:0px;pointer-events:auto;flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:4px 20px 16px 8px;margin:-4px -8px -16px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--g),#000 calc(100% - 20px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 var(--g),#000 calc(100% - 20px),transparent 100%)}
.puces.defile{--g:18px}
.puces::-webkit-scrollbar{display:none}
.puces[hidden]{display:none}
.puce{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 13px;border-radius:22px;border:0;background:var(--surface);box-shadow:var(--ombre);font-weight:600;cursor:pointer;white-space:nowrap}
.puce[aria-checked="true"]{background:var(--encre);color:var(--papier)}
.legende{position:absolute;left:8px;top:64px;z-index:500;width:min(292px,calc(100% - 68px));padding:10px 12px 12px;border-radius:12px;background:var(--surface);box-shadow:var(--ombre)}
.legende[hidden],.legende [hidden]{display:none}
.degrade{height:10px;border-radius:5px}
.degrade-etiq{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:6px;font-size:13px;font-weight:600}
.degrade-etiq span:last-child{text-align:right}
.ages{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;font-weight:600}
.ages li{display:flex;align-items:center;gap:6px}
.rond{flex:none;width:12px;height:12px;border-radius:50%;border:1px solid rgba(15,23,32,.3)}
.leg-ligne{margin-top:6px;font-size:13px;line-height:1.35;color:var(--encre2)}
.leg-alerte{color:var(--alerte);font-weight:600}
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);z-index:550;width:max-content;max-width:calc(100% - 24px);padding:8px 12px;border-radius:10px;background:var(--encre);color:var(--papier);font-size:13px;font-weight:600;box-shadow:var(--ombre)}
.toast[hidden]{display:none}

/* Fiche du point */
.fiche{position:relative;z-index:700;flex:none;display:none;flex-direction:column;max-height:min(40vh,360px);max-height:min(40dvh,360px);margin-top:-16px;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(15,23,32,.2)}
.fiche.ouverte{display:flex}
.carte-zone.couleurs .fiche{max-height:min(30vh,260px);max-height:min(30dvh,260px)}
.f-tete{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:6px 16px;border:0;border-radius:16px 16px 0 0;background:transparent;text-align:left;cursor:pointer}
.f-titres{display:grid;gap:0}
.f-titre{font-weight:700;font-size:16px;line-height:1.3}
.f-coord{font-size:12px;color:var(--encre2);line-height:1.3}
.f-tete .ico{width:20px;height:20px;color:var(--encre2);transition:transform .15s}
.fiche.reduite .f-tete .ico{transform:rotate(180deg)}
.f-corps{flex:1;min-height:0;overflow:auto;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.fiche.reduite .f-corps{display:none}
.mes{border-top:1px solid var(--trait)}
.mesures li:first-child .mes{border-top:0}
.mes summary{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;cursor:pointer;list-style:none}
.mes summary::-webkit-details-marker{display:none}
.sw{flex:none;width:14px;height:14px;border-radius:4px;border:1px solid rgba(15,23,32,.28)}
.mes.vide .sw{background:repeating-linear-gradient(45deg,transparent 0 3px,var(--encre2) 3px 4.5px),var(--voile)}
.mes .nom{flex:1;min-width:0;font-weight:600;line-height:1.3}
.mes .val{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;text-align:right}
.mes .val b{font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.mes .val .u{font-size:13px;color:var(--encre2);white-space:nowrap}
.mes .vide-txt{max-width:170px;font-size:12px;line-height:1.3;color:var(--encre2)}
.chev{width:16px;height:16px;flex:none;color:var(--encre2);transition:transform .15s}
.mes[open] .chev{transform:rotate(180deg)}
.mes.ferme .chev{visibility:hidden}
.corps{padding:0 0 14px 26px}
.det{display:grid;gap:8px}
.det li{font-size:14px;line-height:1.35}
.det .s{display:block;font-size:12px;color:var(--encre2)}
.det a{color:var(--focus)}
.alerte{margin-top:8px;font-size:13px;font-weight:600;color:var(--alerte)}
.note{margin-top:8px;font-size:12px;color:var(--encre2)}

/* Soutenir */
.fab{position:absolute;right:12px;bottom:28px;z-index:650;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px 0 16px;border:0;border-radius:24px;background:var(--signal);color:var(--signal-ink);font-weight:700;box-shadow:0 4px 16px rgba(15,23,32,.3);cursor:pointer}
.fab svg{width:22px;height:22px;fill:currentColor}
.voile{position:fixed;inset:0;z-index:1300;background:rgba(15,23,32,.5)}
.voile[hidden]{display:none}
.feuille{position:fixed;left:0;right:0;bottom:0;z-index:1310;max-height:72vh;max-height:72svh;overflow:auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;background:var(--surface);color:var(--encre);box-shadow:0 -4px 24px rgba(15,23,32,.22);transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.feuille.ouverte{transform:none;visibility:visible;transition:transform .22s ease}
.s-tete{display:flex;align-items:center;justify-content:space-between;gap:10px}
.s-tete h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.fermer{flex:none;width:44px;height:44px;margin-right:-8px;border:0;border-radius:22px;background:var(--voile);cursor:pointer;display:flex;align-items:center;justify-content:center}
.s-intro{margin-top:2px}
.liens{display:grid;gap:10px;margin-top:16px}
.carte-lien{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 14px;border:1px solid var(--trait);border-radius:12px;background:var(--surface);color:inherit;text-decoration:none;text-align:left;cursor:pointer}
.carte-lien .txt{flex:1;min-width:0;display:grid;gap:2px}
.carte-lien strong{font-size:16px;line-height:1.3}
.carte-lien .acc{font-size:14px;color:var(--encre2);line-height:1.4}
.carte-lien .ico{width:20px;height:20px;color:var(--encre2)}
@media (prefers-reduced-motion:reduce){.fiche,.fiche.ouverte,.feuille,.feuille.ouverte,.fab,.chev,.piste,.piste::after,.pin,.f-tete .ico{transition:none}}
noscript p{padding:16px;background:var(--voile)}
</style>
</head>
<body>
<a class="evite" href="#carte">Aller à la carte</a>

<header class="haut">
  <div class="marque">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.5l8 4.6v9.8l-8 4.6-8-4.6V7.1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.3" fill="currentColor"/><path d="M8.2 12A3.8 3.8 0 0 1 12 8.2M15.8 12a3.8 3.8 0 0 1-3.8 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <h1 id="nom-projet">Sensor Maps</h1>
  </div>
</header>

<main class="carte-zone" id="zone">
 <div class="plan" id="plan">
  <div id="carte" role="application" aria-label="Carte. Touche un endroit pour y placer le point."></div>
  <noscript><p>Cette page a besoin de JavaScript pour afficher la carte.</p></noscript>

  <div class="barre">
    <button type="button" class="bascule" id="bascule" role="switch" aria-checked="false"><span class="piste" aria-hidden="true"></span>Couleurs</button>
    <div class="puces" id="puces" role="radiogroup" aria-label="Mesure affichée en couleurs" hidden></div>
  </div>

  <section class="legende" id="legende" aria-label="Légende" hidden>
    <div id="leg-echelle">
      <div class="degrade" id="degrade"></div>
      <div class="degrade-etiq"><span id="leg-min"></span><span id="leg-mid"></span><span id="leg-max"></span></div>
    </div>
    <ul class="ages" id="leg-ages" hidden></ul>
    <p class="leg-ligne" id="leg-note" hidden></p>
    <p class="leg-ligne" id="leg-sources"></p>
    <p class="leg-ligne leg-alerte" id="leg-frais" hidden></p>
    <p class="leg-ligne leg-alerte" id="leg-vide" hidden>Aucune mesure ici. Dézoome pour en voir.</p>
  </section>

  <p class="toast" id="msg" role="status" hidden></p>

  <button type="button" class="fab" id="fab" aria-haspopup="dialog" aria-controls="soutien">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20.5C6 16 3 12.8 3 9a4.5 4.5 0 0 1 9-1.2A4.5 4.5 0 0 1 21 9c0 3.8-3 7-9 11.5z"/></svg>
    <span>Soutenir</span>
  </button>
 </div>

  <section class="fiche" id="fiche" aria-labelledby="fiche-titre">
    <button type="button" class="f-tete" id="fiche-bascule" aria-expanded="true" aria-controls="fiche-corps">
      <span class="f-titres"><span class="f-titre" id="fiche-titre">Mesures à ce point</span><span class="f-coord" id="f-coord"></span></span>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <div class="f-corps" id="fiche-corps"><ul class="mesures" id="mesures"></ul></div>
  </section>
</main>

<footer class="pied">
  <a class="lien-i" href="sources.html">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.4"/></svg>
    <span>Sources et licences</span>
  </a>
  <a class="attrib" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
</footer>

<div class="sr" id="annonce" aria-live="polite"></div>

<div class="voile" id="voile" hidden></div>
<section class="feuille" id="soutien" role="dialog" aria-modal="true" aria-labelledby="soutien-titre" tabindex="-1">
  <div class="s-tete">
    <h2 id="soutien-titre">Soutenir le projet</h2>
    <button type="button" class="fermer" id="soutien-fermer" aria-label="Fermer">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <p class="s-intro">La carte est gratuite et ses données sont ouvertes.</p>
  <ul class="liens" id="liens-soutien"></ul>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
'use strict';

/* =====================================================================
   CONFIGURATION : modifie uniquement ce bloc
   ===================================================================== */
const NOM_PROJET = 'Sensor Maps';             // nom du projet
const CENTRE_PAR_DEFAUT = [48.8566, 2.3522];  // utilisé si la localisation est refusée
const ZOOM_PAR_DEFAUT = 12;                   // zoom de départ sans localisation
const ZOOM_POSITION = 13;                     // zoom une fois localisé
const LIENS_SOUTIEN = [                       // tes liens de dons, sans réseau publicitaire
  // { nom: 'Faire un don', texte: 'Une fois ou chaque mois.', url: 'https://...' }
];
const URL_DEPOT = '';                         // adresse du dépôt GitHub ; vide : devinée depuis l'adresse du site
const DOSSIER_DONNEES = 'data/';
/* ===================================================================== */

const NBSP = String.fromCharCode(160);
const MOINS = String.fromCharCode(0x2212);
const ALPHA = .8;                             // opacité des zones colorées

/* ---------- Outils ---------- */
const $ = (id) => document.getElementById(id);
const borne = (v, a, b) => Math.max(a, Math.min(b, v));
const nfCache = {};
function fmt(v, d) {
  d = d || 0;
  const f = nfCache[d] || (nfCache[d] = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: false }));
  const abs = Math.abs(v), s = f.format(abs), nul = Number(abs.toFixed(d)) === 0;
  return v < 0 && !nul ? MOINS + s : s;
}
function ico(chemin, cls) {
  return '<svg class="ico' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + chemin + '</svg>';
}
function echapper(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function mediane(v) {
  if (!v.length) return null;
  const s = v.slice().sort((a, b) => a - b), n = s.length;
  return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
}
function distanceKm(la1, lo1, la2, lo2) {
  const r = Math.PI / 180, dla = (la2 - la1) * r, dlo = (lo2 - lo1) * r;
  const a = Math.sin(dla / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dlo / 2) ** 2;
  return 12742 * Math.asin(Math.min(1, Math.sqrt(a)));
}
const maintenant = () => Date.now() / 1000;
function fmtDist(km) {
  if (km < 1) return 'à ' + Math.max(10, Math.round(km * 100) * 10) + NBSP + 'm';
  return 'à ' + fmt(km, km < 10 ? 1 : 0) + NBSP + 'km';
}
function fmtDuree(s) {
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + NBSP + 'min';
  if (s < 172800) return Math.round(s / 3600) + NBSP + 'h';
  return Math.round(s / 86400) + NBSP + 'j';
}
const fmtAge = (t) => (maintenant() - t < 90 ? 'à l\'instant' : 'il y a ' + fmtDuree(maintenant() - t));
const enTitre = (t) => String(t || '').toLowerCase().replace(/(^|[\s,(/'-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
const mqSombre = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : { matches: false };

/* ---------- Géométrie : zones hexagonales en mètres Mercator ---------- */
const R_T = 6378137, CIRC = 2 * Math.PI * R_T, S3 = Math.sqrt(3);
function versMerc(lat, lng) {
  const s = Math.sin(borne(lat, -85, 85) * Math.PI / 180);
  return [R_T * lng * Math.PI / 180, R_T * Math.log((1 + s) / (1 - s)) / 2];
}
const HEX = [[0, 1], [S3 / 2, .5], [S3 / 2, -.5], [0, -1], [-S3 / 2, -.5], [-S3 / 2, .5]];
function arrondiHex(qf, rf) {
  const sf = -qf - rf;
  let q = Math.round(qf), r = Math.round(rf), s = Math.round(sf);
  const dq = Math.abs(q - qf), dr = Math.abs(r - rf), ds = Math.abs(s - sf);
  if (dq > dr && dq > ds) q = -r - s; else if (dr > ds) r = -q - s;
  return [q + 0, r + 0];
}

/* ---------- Sources et couches ---------- */
const NOMS_COURTS = {
  emsc: 'EMSC', usgs: 'USGS', meteofrance: 'Météo-France', metar: 'aéroport', sensor_community: 'capteur citoyen',
  lcsqa: 'station officielle', openaq: 'OpenAQ', arcep: 'ARCEP'
};
const NOMS_LEGENDE = {
  emsc: 'EMSC', usgs: 'USGS', meteofrance: 'Météo-France', metar: 'aéroports', sensor_community: 'capteurs citoyens',
  lcsqa: 'stations officielles (LCSQA)', openaq: 'OpenAQ', arcep: 'ARCEP'
};
const COUCHES = [
  {
    id: 'seismes', nom: 'Séismes', titre: 'Séismes des 7 derniers jours', type: 'seismes', rayon: 500,
    sources: ['emsc', 'usgs'], note: 'Séismes déjà enregistrés, aucune prévision.',
    icone: '<path d="M2 12h4l2-6 4 12 3-9 2 3h5"/>'
  },
  {
    id: 'pression', nom: 'Pression', titre: 'Pression au niveau de la mer', unite: 'hPa', dec: 0, min: 995, max: 1030,

    const d = distanceKm(ll.lat, ll.lng, p.lat, p.lon);

}

/* ---------- Fiche du point ---------- */
const LIGNES = [];
function annoncer(txt) { const a = $('annonce'); a.textContent = ''; setTimeout(() => { a.textContent = txt; }, 30); }
function construireMesures() {
  const ul = $('mesures');
  COUCHES.concat(SANS_DONNEES).forEach((C) => {
    const li = document.createElement('li');
    li.innerHTML = '<details class="mes"><summary><span class="sw" aria-hidden="true"></span><span class="nom"></span><span class="val"></span>' + ico('<path d="M6 9l6 6 6-6"/>', 'chev') + '</summary><div class="corps"></div></details>';
    li.querySelector('.nom').textContent = C.nom;
    const det = li.firstChild;
    det.querySelector('summary').addEventListener('click', (e) => { if (det.classList.contains('ferme')) e.preventDefault(); });
    LIGNES.push({ det: det, sw: li.querySelector('.sw'), val: li.querySelector('.val'), corps: li.querySelector('.corps') });
    ul.appendChild(li);
  });
  SANS_DONNEES.forEach((C, k) => {
    const ln = LIGNES[COUCHES.length + k];
    ln.det.classList.add('vide', 'ferme');
    ln.val.innerHTML = '<span class="vide-txt">Pas encore de données ouvertes récentes</span>';
  });
}
function coordTxt(ll) {
  return fmt(Math.abs(ll.lat), 4) + NBSP + (ll.lat >= 0 ? 'N' : 'S') + ', ' + fmt(Math.abs(ll.lng), 4) + NBSP + (ll.lng >= 0 ? 'E' : 'O');
}
function majFiche() {
  if (!pinLL) return;
  $('f-coord').textContent = coordTxt(pinLL);
  const resumes = COUCHES.map((C) => resumer(C, pinLL));
  if (etat.couleurs) {
    const R = resumes[COUCHES.indexOf(etat.couche)];
    $('fiche-titre').textContent = etat.couche.nom + ' : ' + (R.titre || R.vide);
  } else $('fiche-titre').textContent = 'Mesures à ce point';
  COUCHES.forEach((C, k) => {
    const R = resumes[k], ln = LIGNES[k], vide = !R.tete, plus = alertes(C);
    ln.det.classList.toggle('vide', vide);
    ln.det.classList.toggle('ferme', vide && !plus);
    if (vide && !plus) ln.det.open = false;
    ln.sw.style.background = vide ? '' : 'rgb(' + R.rgb.join(',') + ')';
    ln.val.innerHTML = vide ? '<span class="vide-txt">' + echapper(R.vide) + '</span>' : R.tete;
    ln.corps.innerHTML = (R.corps || '') + plus + (C.note && !vide ? '<p class="note">' + echapper(C.note) + '</p>' : '');
  });
}
let fichePlanifiee = false;
function planifierFiche() {
  if (fichePlanifiee) return;
  fichePlanifiee = true;
  requestAnimationFrame(() => { fichePlanifiee = false; majFiche(); dessiner(); });
}
function basculerFiche(ouvrir) {
  const f = $('fiche'), reduite = ouvrir === undefined ? !f.classList.contains('reduite') : !ouvrir;
  f.classList.toggle('reduite', reduite);
  $('fiche-bascule').setAttribute('aria-expanded', String(!reduite));
  if (carte) { carte.invalidateSize({ pan: false }); garderVisible(); }
}

/* ---------- Le point ---------- */
const ICONE_PIN = '<svg class="pin" viewBox="0 0 44 44" aria-hidden="true" focusable="false"><ellipse cx="22" cy="41" rx="6" ry="2.2" fill="rgba(0,0,0,.28)"/><path d="M22 41S9 28 9 18.5a13 13 0 0 1 26 0C35 28 22 41 22 41z" fill="#0f1720" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/><circle cx="22" cy="18.5" r="5" fill="#ffffff"/></svg>';
const RECOUVRE = 16;   /* la fiche recouvre le bas de la carte de 16 px (coins arrondis) */
function haut() {
  if (!etat.couleurs) return 60;
  const z = $('plan').getBoundingClientRect(), l = $('legende').getBoundingClientRect();
  return Math.max(60, l.bottom - z.top + 8);
}
function garderVisible() {
  if (!carte || !pinLL) return;
  carte.panInside(pinLL, { paddingTopLeft: [24, haut() + 44], paddingBottomRight: [24, RECOUVRE + 76] });
}
function centrerPin() {
  if (!carte || !pinLL) return;
  const cible = (carte.getSize().y - RECOUVRE) / 2 + 20;   /* l'icône du point est centrée sur la carte */
  const cur = carte.latLngToContainerPoint(pinLL);
  carte.panBy([0, cur.y - cible], { animate: false });
}
function placerPin(ll, opts) {
  pinLL = L.latLng(ll.lat, ll.lng);
  if (marqueur) marqueur.setLatLng(pinLL);
  $('fiche').classList.add('ouverte');
  if (carte) carte.invalidateSize({ pan: false });
  majFiche();
  dessiner();
  if (opts && opts.annoncer) annoncer('Point placé : ' + coordTxt(pinLL) + '. Mesures mises à jour.');
}

/* ---------- Couches et légende ---------- */
function construirePuces() {
  const zone = $('puces');
  COUCHES.forEach((C) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'puce'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', 'false'); b.dataset.id = C.id;
    b.innerHTML = ico(C.icone) + '<span>' + C.nom + '</span>';
    b.addEventListener('click', () => choisirCouche(C.id));
    zone.appendChild(b);
  });
}
function majLegende() {
  const C = etat.couche, seismes = C.type === 'seismes';
  $('leg-echelle').hidden = seismes;
  $('leg-ages').hidden = !seismes;
  if (seismes) {
    $('leg-ages').innerHTML = AGES_SEISMES.map((a) => '<li><span class="rond" style="background:' + a.couleur + '"></span>' + a.nom + '</li>').join('');
  } else {
    $('degrade').style.background = gradientCss(C);
    $('leg-min').textContent = fmt(C.min, 0) + NBSP + C.unite;
    $('leg-mid').textContent = '';
    $('leg-max').textContent = (C.legMaxPlus ? String.fromCharCode(0x2265) + NBSP : '') + fmt(C.max, 0) + NBSP + C.unite;
  }
  $('leg-note').textContent = C.note || '';
  $('leg-note').hidden = !C.note;
  /* Une seule ligne : d'où viennent les couleurs, et de quand (ou la campagne de mesure pour le débit) */
  const avec = sourcesAvecDonnees(C);
  const frais = avec.map((id) => [id, fraicheur(id)]).filter((x) => x[1]);
  let quand = '';
  if (C.id === 'debit') {
    const s = infoSource('arcep');
    quand = s && s.periode ? s.periode.replace(/^campagnes\s+/i, '') : '';
  } else if (frais.length) quand = fmtAge(maintenant() - Math.min.apply(null, frais.map((x) => x[1].age)));
  $('leg-sources').textContent = avec.length ? 'Sources : ' + avec.map((id) => NOMS_LEGENDE[id]).join(', ') + (quand ? ' · ' + quand : '')
    : (MANIFESTE ? 'Pas encore de données collectées' : 'Chargement…');
  const perimes = frais.filter((x) => x[1].perime);
  $('leg-frais').textContent = perimes.length ? 'Périmé : ' + perimes.map((x) => NOMS_LEGENDE[x[0]] + ' (depuis ' + fmtDuree(x[1].age) + ')').join(', ') : '';
  $('leg-frais').hidden = !perimes.length;
}
/* Si rien n'est visible, on élargit la vue jusqu'aux mesures les plus proches du point */
function cadrerSiVide() {
  const C = etat.couche, liste = D[C.id];
  if (!liste.length || !pinLL) return;
  const b = carte.getBounds();
  if (liste.some((p) => b.contains([p.lat, p.lon]))) return;
  const proches = plusProches(liste, pinLL, 20000, C.type === 'seismes' ? 3 : 6);
  if (!proches.length) return;
  const zone = L.latLngBounds([pinLL]);
  proches.forEach((x) => zone.extend([x[1].lat, x[1].lon]));
  carte.fitBounds(zone, { paddingTopLeft: [30, haut() + 50], paddingBottomRight: [60, RECOUVRE + 90], maxZoom: 13, animate: false });
}
function choisirCouche(id) {
  etat.couche = COUCHES.find((c) => c.id === id) || COUCHES[0];
  document.querySelectorAll('#puces .puce').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.id === etat.couche.id)));
  majLegende();
  majFiche();
  cadrerSiVide();
  garderVisible();
  dessiner();
  annoncer('Couleurs : ' + (etat.couche.titre || etat.couche.nom) + '.');
}
function basculerCouleurs(v) {
  etat.couleurs = v;
  $('bascule').setAttribute('aria-checked', String(v));
  $('puces').hidden = !v;
  $('legende').hidden = !v;
  $('plan').classList.toggle('couleurs', v);
  $('zone').classList.toggle('couleurs', v);
  /* Avec les couleurs, la fiche se replie pour laisser de la place à la carte ; elle retrouve son état à la désactivation */
  const f = $('fiche');
  if (v) { etat.ficheReduiteAvant = f.classList.contains('reduite'); basculerFiche(false); }
  else basculerFiche(!etat.ficheReduiteAvant);
  majLegende();
  majFiche();
  if (v) cadrerSiVide();
  dessiner();
  garderVisible();
  annoncer(v ? 'Couleurs affichées : ' + (etat.couche.titre || etat.couche.nom) + '.' : 'Couleurs masquées.');
}
function majTout() {
  majLegende();
  majFiche();
  planifier();
}

/* ---------- Message temporaire ---------- */
let minuteur = 0;
function msg(txt, ms) {
  const m = $('msg');
  clearTimeout(minuteur);
  if (!txt) { m.hidden = true; return; }
  m.textContent = txt;
  m.hidden = false;
  if (ms) minuteur = setTimeout(() => { m.hidden = true; }, ms);
}

/* ---------- Localisation (ta position reste dans ton téléphone : elle n'est envoyée nulle part) ---------- */
function localiser() {
  if (!navigator.geolocation) { msg('Localisation indisponible. Place le point où tu veux.', 5000); return; }
  navigator.geolocation.getCurrentPosition((pos) => {
    const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
    if (pointUtilisateur) pointUtilisateur.setLatLng(ll);
    else pointUtilisateur = L.circleMarker(ll, { radius: 8, weight: 3, color: '#ffffff', fillColor: '#1a73e8', fillOpacity: 1, interactive: false }).addTo(carte);
    carte.setView(ll, Math.max(carte.getZoom(), ZOOM_POSITION), { animate: false });
    placerPin(ll);
    centrerPin();
    dessiner();
    annoncer('Position trouvée. Point placé sur ta position.');
  }, (err) => {
    msg(err && err.code === 1 ? 'Localisation refusée. Place le point où tu veux.' : 'Position introuvable. Place le point où tu veux.', 5000);
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 60000 });
}

/* ---------- Soutenir ---------- */
let focusAvant = null;
function devinerDepot() {
  if (URL_DEPOT) return URL_DEPOT;
  const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
  if (!m) return '';
  const dossier = location.pathname.split('/').filter(Boolean)[0];
  return 'https://github.com/' + m[1] + '/' + (dossier && !/\.html?$/i.test(dossier) ? dossier : m[1] + '.github.io');
}
function carteLien(titre, texte, cible) {
  const el = document.createElement(typeof cible === 'string' ? 'a' : 'button');
  el.className = 'carte-lien';
  if (typeof cible === 'string') { el.href = cible; el.target = '_blank'; el.rel = 'noopener'; } else { el.type = 'button'; el.addEventListener('click', cible); }
  el.innerHTML = '<span class="txt"><strong></strong><span class="acc"></span></span>' +
    ico('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>');
  el.querySelector('strong').textContent = titre;
  el.querySelector('.acc').textContent = texte;
  const li = document.createElement('li');
  li.appendChild(el);
  return li;
}
function construireSoutien() {
  const ul = $('liens-soutien'), adresse = location.href.split('#')[0];
  LIENS_SOUTIEN.forEach((s) => ul.appendChild(carteLien(s.nom, s.texte, s.url)));
  ul.appendChild(carteLien('Partager la carte', 'La meilleure aide : la faire connaître.', () => {
    if (navigator.share) navigator.share({ title: NOM_PROJET, url: adresse }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(adresse).then(() => msg('Adresse copiée.', 3000), () => msg(adresse, 6000));
    else msg(adresse, 6000);
  }));
  const depot = devinerDepot();
  if (depot) ul.appendChild(carteLien('Code et données', 'Tout est ouvert, sur GitHub.', depot));
}
function ouvrirSoutien() {
  focusAvant = document.activeElement;
  $('voile').hidden = false;
  $('soutien').classList.add('ouverte');
  $('soutien-fermer').focus();
}
function fermerSoutien() {
  if (!$('soutien').classList.contains('ouverte')) return;
  $('voile').hidden = true;
  $('soutien').classList.remove('ouverte');
  if (focusAvant && focusAvant.focus) focusAvant.focus();
}
function pieger(e) {
  if (e.key !== 'Tab' || !$('soutien').classList.contains('ouverte')) return;
  const f = Array.from($('soutien').querySelectorAll('a[href],button:not([disabled])'));
  if (!f.length) return;
  const premier = f[0], dernier = f[f.length - 1];
  if (e.shiftKey && document.activeElement === premier) { e.preventDefault(); dernier.focus(); }
  else if (!e.shiftKey && document.activeElement === dernier) { e.preventDefault(); premier.focus(); }
  else if (!$('soutien').contains(document.activeElement)) { e.preventDefault(); premier.focus(); }
}

/* ---------- Carte Leaflet ---------- */
function initCarte() {
  const zone = $('carte');
  if (typeof L === 'undefined') {
    zone.innerHTML = '<div class="carte-vide" role="alert">La carte ne se charge pas. Vérifie ta connexion, puis recharge la page.</div>';
    return false;
  }
  carte = L.map(zone, {
    center: CENTRE_PAR_DEFAUT, zoom: ZOOM_PAR_DEFAUT, minZoom: 3, maxZoom: 19, zoomControl: false, attributionControl: false,
    zoomAnimation: false, fadeAnimation: false, markerZoomAnimation: false,
    maxBounds: [[-85, -180], [85, 180]], maxBoundsViscosity: 1, worldCopyJump: false
  });
  L.control.zoom({ position: 'topright', zoomInTitle: 'Zoomer', zoomOutTitle: 'Dézoomer' }).addTo(carte);
  const Loc = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      const bar = L.DomUtil.create('div', 'leaflet-bar');
      const a = L.DomUtil.create('a', 'loc', bar);
      a.href = '#'; a.setAttribute('role', 'button'); a.title = 'Me localiser'; a.setAttribute('aria-label', 'Me localiser');
      a.innerHTML = ico('<circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>');
      L.DomEvent.disableClickPropagation(bar);
      L.DomEvent.on(a, 'click', (e) => { L.DomEvent.preventDefault(e); localiser(); });
      return bar;
    }
  });
  new Loc().addTo(carte);
  const tuiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, updateWhenIdle: false, keepBuffer: 3, attribution: '&copy; contributeurs OpenStreetMap'
  }).addTo(carte);
  let ok = 0, ko = 0;
  tuiles.on('tileload', () => { ok++; });
  tuiles.on('tileerror', () => {
    ko++;
    if (ko === 3 && ok === 0) msg('Fond de carte indisponible. Le reste fonctionne.', 6000);
  });
  cvGrille = creerCanvas('couleurs', 450);
  marqueur = L.marker(CENTRE_PAR_DEFAUT, {
    draggable: true, autoPan: false, keyboard: true, title: 'Point à déplacer', alt: 'Point à déplacer', zIndexOffset: 1000,
    icon: L.divIcon({ className: 'pin-wrap', html: ICONE_PIN, iconSize: [44, 44], iconAnchor: [22, 41] })
  }).addTo(carte);
  marqueur.on('dragstart', () => { marqueur.getElement().classList.add('leve'); });
  marqueur.on('drag', () => { pinLL = marqueur.getLatLng(); planifierFiche(); });
  marqueur.on('dragend', () => {
    marqueur.getElement().classList.remove('leve');
    pinLL = marqueur.getLatLng();
    planifierFiche();
    garderVisible();
    annoncer('Point déplacé : ' + coordTxt(pinLL) + '. Mesures mises à jour.');
  });
  marqueur.on('click', () => { $('fiche').classList.add('ouverte'); basculerFiche(true); });
  marqueur.getElement().addEventListener('keydown', (e) => {
    const d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
    if (!d) return;
    e.preventDefault(); e.stopPropagation();
    const p = carte.latLngToContainerPoint(marqueur.getLatLng()).add([d[0] * 24, d[1] * 24]);
    placerPin(carte.containerPointToLatLng(p), { annoncer: true });
  });
  carte.on('move zoom resize viewreset zoomend moveend', planifier);
  carte.on('click', (e) => { placerPin(e.latlng, { annoncer: true }); garderVisible(); });
  carte.getContainer().addEventListener('keydown', (e) => {
    if (e.target === carte.getContainer() && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); placerPin(carte.getCenter(), { annoncer: true }); }
  });
  if (mqSombre.addEventListener) mqSombre.addEventListener('change', planifier);
  else if (mqSombre.addListener) mqSombre.addListener(planifier);
  if (window.ResizeObserver) {
    new ResizeObserver(() => { carte.invalidateSize({ pan: false }); planifier(); }).observe($('plan'));
  }
  window.addEventListener('load', () => { carte.invalidateSize(); planifier(); });
  return true;
}

/* ---------- Démarrage ---------- */
function demarrer() {
  document.title = NOM_PROJET;
  $('nom-projet').textContent = NOM_PROJET;
  construirePuces();
  construireMesures();
  construireSoutien();
  $('bascule').addEventListener('click', () => basculerCouleurs(!etat.couleurs));
  $('puces').addEventListener('scroll', (e) => e.target.classList.toggle('defile', e.target.scrollLeft > 4), { passive: true });
  $('fiche-bascule').addEventListener('click', () => basculerFiche());
  $('fab').addEventListener('click', ouvrirSoutien);
  $('soutien-fermer').addEventListener('click', fermerSoutien);
  $('voile').addEventListener('click', fermerSoutien);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') fermerSoutien();
    pieger(e);
  });
  document.querySelector('#puces .puce').setAttribute('aria-checked', 'true');
  majLegende();
  if (!initCarte()) return;
  placerPin(L.latLng(CENTRE_PAR_DEFAUT[0], CENTRE_PAR_DEFAUT[1]));
  centrerPin();
  charger();
  localiser();
  setInterval(majTout, 60000);   /* les âges affichés (« il y a 6 min ») avancent tout seuls */
}
demarrer();
})();
</script>
